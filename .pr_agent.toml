# Qodo was the second PR reviewer until its trial ended. Since 27 Oct 2026 its review is no longer
# a merge gate (CLAUDE.md, Git). This file stays while Qodo's app is installed, so any review it
# still posts never rewrites the PR description, which holds the "Before merging" steps; delete it
# once the app is uninstalled (C0.9 OD-30).
[github_app]
# Review only: Qodo's describe rewrites the PR description, which holds the "Before merging" steps.
pr_commands = ["/agentic_review"]
# Review every push, merges of main included, so the latest commit always has a Qodo review.
handle_push_trigger = true
push_trigger_ignore_merge_commits = false
push_commands = ["/agentic_review"]
