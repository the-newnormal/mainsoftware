            exit 1
          fi
          OVERRIDES=$(jq -nc --arg t "$TARGETS" '{containerOverrides:[{name:"server",environment:[{name:"PROBE_TARGETS",value:$t}]}]}')
          NET_PROBE=$(jq -nc --arg s "$ISOLATED_SUBNETS" --arg g "$PROBE_SG" '{awsvpcConfiguration:{subnets:($s|split(",")),securityGroups:[$g],assignPublicIp:"DISABLED"}}')
