          ATTEMPT: ${{ needs.prod.outputs.attempt }}
          RELEASE: ${{ needs.gate.outputs.commit }}:${{ needs.prod.outputs.digest }}
          PROFILE_AT: ${{ needs.gate.outputs.commit }}
          MODE: ${{ needs.gate.outputs.mode }}
          TARGET: ${{ needs.gate.outputs.target }}
          RESTORE: ${{ needs.gate.outputs.restore }}
